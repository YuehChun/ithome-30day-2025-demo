
name: Test GitHub Actions
on: [push]
jobs:
  test-env-variables:
    runs-on: ubuntu-latest
    steps:
      - name: Print Environment Variables
        run: |
          echo "GITHUB_ACTOR: $GITHUB_ACTOR"
          echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
          echo "GITHUB_SHA: $GITHUB_SHA"
